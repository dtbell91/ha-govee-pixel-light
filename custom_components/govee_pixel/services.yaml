show_image:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    duration:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    image_path:
      example: /config/www/govee/weather.gif
      selector:
        text:
    image_url:
      example: https://example.com/animation.gif
      selector:
        text:
          type: url
    image_entity:
      selector:
        entity:
          domain:
            - image
            - camera
    fit:
      default: contain
      selector:
        select:
          translation_key: fit
          options:
            - contain
            - cover
            - stretch
    resample:
      default: lanczos
      selector:
        select:
          translation_key: resample
          options:
            - nearest
            - box
            - bilinear
            - lanczos
    background:
      default: [0, 0, 0]
      selector:
        color_rgb:
    frame_duration:
      selector:
        number:
          min: 30
          max: 30000
          step: 10
          unit_of_measurement: ms
          mode: box
    max_frames:
      default: 100
      selector:
        number:
          min: 1
          max: 100
          mode: box

show_weather:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    duration:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    weather_entity:
      selector:
        entity:
          domain: weather
    forecast:
      default: false
      selector:
        boolean:
    condition:
      example: rainy
      selector:
        select:
          custom_value: true
          options:
            - sunny
            - clear-night
            - partlycloudy
            - cloudy
            - fog
            - rainy
            - pouring
            - lightning
            - lightning-rainy
            - snowy
            - snowy-rainy
            - hail
            - windy
            - exceptional
    temperature:
      example: 21
      selector:
        number:
          min: -99
          max: 199
          mode: box
    temperature_unit:
      selector:
        select:
          options:
            - "°C"
            - "°F"

show_text:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    duration:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    message:
      required: true
      example: Dinner is ready!
      selector:
        text:
    color:
      selector:
        color_rgb:
    background:
      default: [0, 0, 0]
      selector:
        color_rgb:
    size:
      default: large
      selector:
        select:
          translation_key: size
          options:
            - large
            - small
    frame_duration:
      default: 70
      selector:
        number:
          min: 30
          max: 1000
          step: 10
          unit_of_measurement: ms
          mode: box

show_animation:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    duration:
      selector:
        number:
          min: 0
          max: 86400
          unit_of_measurement: s
          mode: box
    animation:
      required: true
      selector:
        select:
          translation_key: animation
          options:
            - morning
            - bus
            - maths
            - reading
            - art
            - music
            - sport
            - playground
            - lunch
            - homework
            - bedtime
            - heart

playlist_add:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    name:
      required: true
      example: weather
      selector:
        text:
    item_type:
      required: true
      selector:
        select:
          translation_key: item_type
          options:
            - image
            - weather
            - text
            - animation
    options:
      example: '{"weather_entity": "weather.home"}'
      selector:
        object:
    duration:
      default: 30
      selector:
        number:
          min: 1
          max: 65535
          unit_of_measurement: s
          mode: box
    position:
      selector:
        number:
          min: 0
          max: 19
          mode: box

playlist_remove:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true
    name:
      required: true
      selector:
        text:

playlist_clear:
  fields:
    device_id: &target
      required: true
      selector:
        device:
          integration: govee_pixel
          multiple: true

playlist_resume:
  fields:
    device_id: *target

playlist_refresh:
  fields:
    device_id: *target
